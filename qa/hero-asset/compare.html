<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>W Automobiles — Hero Car Cutout Candidates (A-1 .. D-2)</title>
  <style>
    :root {
      --hero-bg: #0b121a;
      --card-border: rgba(255, 255, 255, 0.11);
      --ivory: #f4f1ec;
      --silver: #9aa6b2;
      --accent: #c8102e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #070b10;
      color: var(--ivory);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 28px 32px 48px;
    }
    header {
      max-width: 1680px;
      margin: 0 auto 24px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 14px;
    }
    header h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    header p {
      font-size: 13px;
      color: var(--silver);
    }
    .grid {
      max-width: 1680px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }
    .candidate-card {
      background: #0d1520;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      overflow: hidden;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--card-border);
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge-id {
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      padding: 3px 9px;
      border-radius: 6px;
      letter-spacing: 0.05em;
    }
    .model-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--ivory);
    }
    .meta {
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--silver);
      background: rgba(0, 0, 0, 0.35);
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .panels {
      display: grid;
      grid-template-columns: 1.35fr 0.75fr 1fr;
      gap: 1px;
      background: var(--card-border);
    }
    .panel {
      position: relative;
      background-color: var(--hero-bg);
      height: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 18px 12px 24px;
    }
    .panel-label {
      position: absolute;
      top: 8px;
      left: 10px;
      z-index: 10;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(244, 241, 236, 0.72);
      background: rgba(5, 8, 12, 0.68);
      padding: 2px 6px;
      border-radius: 4px;
    }
    /* Simulated showroom floor + contact shadow + reflection inside each preview panel */
    .stage-box {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .panel-desktop .stage-box {
      width: 68%;
    }
    .panel-phone .stage-box {
      width: 86%;
    }
    .panel-bright {
      filter: brightness(5);
    }
    .panel-bright .stage-box {
      width: 74%;
    }
    .car-img {
      position: relative;
      z-index: 3;
      width: 100%;
      height: auto;
      display: block;
    }
    .contact-shadow {
      position: relative;
      z-index: 2;
      width: 96%;
      height: 12px;
      margin-top: -7px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.65) 52%, transparent 80%);
    }
    .reflection-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 44px;
      margin-top: -3px;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.34) 0%, rgba(0,0,0,0.1) 42%, transparent 88%);
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.34) 0%, rgba(0,0,0,0.1) 42%, transparent 88%);
    }
    .reflection-img {
      width: 100%;
      height: auto;
      transform: scaleY(-0.72);
      transform-origin: 50% 0%;
      opacity: 0.5;
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <h1>Hero Car Cutout Candidates — Contact Sheet (on <code>--hero-bg: #0b121a</code>)</h1>
    <p>Each candidate shows: (1) Desktop Hero proportion, (2) Phone Hero proportion (86% width), (3) <code>filter: brightness(5)</code> edge/fringe audit</p>
  </header>

  <div class="grid" id="grid"></div>

  <script>
    const CANDIDATES = [
      { id: "A-1", model: "Audi RS e-tron GT — Variation 1", dims: "2400 × 1602 px", file: "candidates/candidate-A-1.png" },
      { id: "A-2", model: "Audi RS e-tron GT — Variation 2", dims: "2400 × 1624 px", file: "candidates/candidate-A-2.png" },
      { id: "B-1", model: "Mercedes-AMG GT 4-Door Coupé — Variation 1", dims: "2400 × 1681 px", file: "candidates/candidate-B-1.png" },
      { id: "B-2", model: "Mercedes-AMG GT 4-Door Coupé — Variation 2", dims: "2400 × 1663 px", file: "candidates/candidate-B-2.png" },
      { id: "C-1", model: "Porsche 911 Carrera (992) — Variation 1", dims: "2400 × 1665 px", file: "candidates/candidate-C-1.png" },
      { id: "C-2", model: "Porsche 911 Carrera (992) — Variation 2", dims: "2400 × 1661 px", file: "candidates/candidate-C-2.png" },
      { id: "D-1", model: "Audi RS7 Sportback (2024) — Variation 1", dims: "2400 × 1658 px", file: "candidates/candidate-D-1.png" },
      { id: "D-2", model: "Audi RS7 Sportback (2024) — Variation 2", dims: "2400 × 1670 px", file: "candidates/candidate-D-2.png" },
    ];

    const grid = document.getElementById("grid");
    for (const c of CANDIDATES) {
      const card = document.createElement("div");
      card.className = "candidate-card";
      card.innerHTML = `
        <div class="card-header">
          <div class="title-group">
            <span class="badge-id">${c.id}</span>
            <span class="model-name">${c.model}</span>
          </div>
          <span class="meta">${c.dims}</span>
        </div>
        <div class="panels">
          <div class="panel panel-desktop">
            <span class="panel-label">Desktop (--hero-bg)</span>
            <div class="stage-box">
              <img class="car-img" src="${c.file}" alt="${c.model}" />
              <div class="contact-shadow"></div>
              <div class="reflection-wrap">
                <img class="reflection-img" src="${c.file}" alt="" />
              </div>
            </div>
          </div>
          <div class="panel panel-phone">
            <span class="panel-label">Phone (86% w)</span>
            <div class="stage-box">
              <img class="car-img" src="${c.file}" alt="${c.model}" />
              <div class="contact-shadow"></div>
              <div class="reflection-wrap">
                <img class="reflection-img" src="${c.file}" alt="" />
              </div>
            </div>
          </div>
          <div class="panel panel-bright">
            <span class="panel-label">brightness(5) test</span>
            <div class="stage-box">
              <img class="car-img" src="${c.file}" alt="${c.model}" />
              <div class="contact-shadow"></div>
            </div>
          </div>
        </div>
      `;
      grid.appendChild(card);
    }
  </script>
</body>
</html>
